[package]
name = "pgconnect"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "PostgreSQL connection manager CLI with encrypted storage"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/pgconnect"
keywords = ["postgresql", "database", "cli", "connection-manager"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "pgconnect"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dialoguer = "0.11"
aes-gcm = "0.10"
argon2 = "0.5"
directories = "5"
rand = "0.8"
urlencoding = "2"

derive_more = { version = "2", features = ["from"]}
url = "2.5.8"
